name: Nightly Mobile Interaction Benchmark

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: perf-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inp-bench:
    name: Mobile Interaction Report (synergy-detail)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Build
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ADSENSE_DISABLED: "true"
        run: npm run build

      - name: Start server
        run: npm run start &
        env:
          PORT: 3000
          NEXT_PUBLIC_ADSENSE_DISABLED: "true"

      - name: Wait for server
        run: npx --yes wait-on http://localhost:3000 -t 60000

      - name: Run 50ms stress scenario
        env:
          BENCH_URL: http://localhost:3000/synergy-detail
          RUNS: 30
          WARMUP_RUNS: 2
          CPU_THROTTLE: 6
          INTER_TAP_MS: 50
          PERF_HARD_GATE: "0"
          CI_OUTPUT_PATH: inp-nightly-stress.json
        run: node scripts/inp-ci.mjs

      - name: Run 1s general scenario
        env:
          BENCH_URL: http://localhost:3000/synergy-detail
          RUNS: 30
          WARMUP_RUNS: 2
          CPU_THROTTLE: 6
          INTER_TAP_MS: 1000
          PERF_HARD_GATE: "0"
          CI_OUTPUT_PATH: inp-nightly-general.json
        run: node scripts/inp-ci.mjs

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-interaction-nightly
          path: frontend/inp-nightly-*.json
          retention-days: 30
