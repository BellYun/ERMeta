    <text x="120" y="155" fill="#64748b" font-size="24">URL 반영 → 첫 결과 카드 표시 p50 · production build · 조건별 10회</text>

    <circle cx="1050" cy="212" r="10" fill="#2563eb"/>
    <text x="1070" y="220" fill="#334155" font-size="21">기존 정확 조회</text>
    <circle cx="1270" cy="212" r="10" fill="#f97316"/>
